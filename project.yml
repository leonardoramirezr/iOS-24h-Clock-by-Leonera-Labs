# XcodeGen specification. Generate the Xcode project with `xcodegen generate`.
name: Clock24

options:
  bundleIdPrefix: com.leonardoramirezr
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Bundle identifiers. CI passes the same values as xcodebuild build settings,
    # so they can be overridden without editing the project.
    APP_BUNDLE_ID: com.leonardoramirezr.24hclock
    WIDGET_BUNDLE_ID: $(APP_BUNDLE_ID).widget
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Clock24:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Clock24
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: Clock24Widget

  Clock24Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Clock24Widget
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Clock24:
    build:
      targets:
        Clock24: all
    run:
      config: Debug
    archive:
      config: Release
